<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BudgetFlow</title>

    <script src="./script.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white overflow-hidden">

    <!-- PAGE -->
    <main class="relative min-h-screen flex items-center justify-center px-4 py-5">

        <!-- BACKGROUND -->
        <div class="absolute inset-0
                    bg-gradient-to-br
                    from-emerald-950
                    via-slate-950
                    to-teal-950">
        </div>

        <!-- Large Emerald Glow - Top Left -->
        <div class="absolute
                    -top-40
                    -left-40
                    w-[550px]
                    h-[550px]
                    bg-emerald-500/20
                    rounded-full
                    blur-[100px]">
        </div>

        <!-- Large Teal Glow - Bottom Right -->
        <div class="absolute
                    -bottom-40
                    -right-40
                    w-[550px]
                    h-[550px]
                    bg-teal-500/20
                    rounded-full
                    blur-[100px]">
        </div>

        <!-- Emerald Glow - Right Top -->
        <div class="absolute
                    top-20
                    right-10
                    w-72
                    h-72
                    bg-emerald-400/10
                    rounded-full
                    blur-[80px]">
        </div>

        <!-- Teal Glow - Bottom Left -->
        <div class="absolute
                    bottom-10
                    left-10
                    w-72
                    h-72
                    bg-teal-400/10
                    rounded-full
                    blur-[80px]">
        </div>

        <!-- Decorative Circle -->
        <div class="absolute
                    top-16
                    left-1/2
                    -translate-x-1/2
                    w-[450px]
                    h-[450px]
                    border
                    border-emerald-500/10
                    rounded-full">
        </div>

        <!-- Decorative Circle -->
        <div class="absolute
                    top-24
                    left-1/2
                    -translate-x-1/2
                    w-[350px]
                    h-[350px]
                    border
                    border-teal-400/10
                    rounded-full">
        </div>

        <!-- Grid Pattern -->
        <div class="absolute inset-0
                    opacity-[0.08]
                    bg-[linear-gradient(rgba(16,185,129,0.5)_1px,transparent_1px),
                        linear-gradient(90deg,rgba(16,185,129,0.5)_1px,transparent_1px)]
                    bg-[size:45px_45px]">
        </div>


        <!-- LOGIN CONTAINER -->
        <div class="relative z-10
                    w-full
                    max-w-md
                    bg-slate-900
                    border border-slate-800
                    rounded-3xl
                    shadow-2xl
                    px-6 py-7
                    sm:px-9 sm:py-9
                    md:px-10 md:py-10">


            <!-- TOP BRAND -->
            <div class="flex items-center justify-between mb-8">

                <div class="flex items-center gap-2.5">

                    <div class="w-10 h-10
                                rounded-xl
                                bg-emerald-500
                                text-slate-950
                                flex items-center justify-center
                                text-xl
                                font-bold
                                shadow-lg
                                shadow-emerald-500/20">

                        ₹

                    </div>

                    <h1 class="text-xl font-bold">

                        BudgetFlow

                    </h1>

                </div>


                <!-- <span class="hidden sm:block
                             text-[10px]
                             uppercase
                             tracking-[0.2em]
                             text-slate-500">

                    Secure Login

                </span> -->

            </div>


            <!-- HEADING -->
            <div class="mb-7">

                <p class="text-emerald-400
                          text-[10px]
                          sm:text-xs
                          uppercase
                          tracking-[0.25em]
                          font-semibold
                          mb-2">

                    Welcome Back

                </p>

                <h2 class="text-2xl
                           sm:text-3xl
                           font-bold
                           leading-tight">

                    Sign in to your account

                </h2>

                <!-- <p class="text-slate-400
                          text-xs
                          sm:text-sm
                          mt-2">

                    Continue managing your finances.

                </p> -->

            </div>


            <!-- FORM -->
            <form class="space-y-5">


                <!-- EMAIL -->
                <div>

                    <label
                        for="email"
                        class="block
                               text-xs
                               sm:text-sm
                               font-medium
                               text-slate-300
                               mb-2">

                        Email Address

                    </label>

                    <div class="relative">

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            class="w-full
                                   px-4
                                   py-3.5
                                   rounded-xl
                                   bg-slate-800
                                   border
                                   border-slate-700
                                   text-white
                                   text-sm
                                   placeholder-slate-500
                                   outline-none
                                   transition
                                   duration-200
                                   hover:border-slate-600
                                   focus:border-emerald-500
                                   focus:ring-2
                                   focus:ring-emerald-500/20">

                    </div>

                </div>


                <!-- PASSWORD -->
                <div>

                    <label
                        for="password"
                        class="block
                               text-xs
                               sm:text-sm
                               font-medium
                               text-slate-300
                               mb-2">

                        Password

                    </label>

                    <div class="relative">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            class="w-full
                                   px-4
                                   py-3.5
                                   rounded-xl
                                   bg-slate-800
                                   border
                                   border-slate-700
                                   text-white
                                   text-sm
                                   placeholder-slate-500
                                   outline-none
                                   transition
                                   duration-200
                                   hover:border-slate-600
                                   focus:border-emerald-500
                                   focus:ring-2
                                   focus:ring-emerald-500/20">

                    </div>

                </div>


                <!-- REMEMBER -->
                <div class="flex items-center justify-between">

                    <label class="flex items-center gap-2 cursor-pointer">

                        <input
                            type="checkbox"
                            id="remember"
                            class="w-4 h-4
                                   accent-emerald-500
                                   shrink-0">

                        <span class="text-xs
                                     sm:text-sm
                                     text-slate-400">

                            Remember me

                        </span>

                    </label>


                    <span class="text-xs
                                 text-slate-600">

                        Secure access

                    </span>

                </div>


                <!-- LOGIN ACTION -->
                <button
                    onclick="logbtnn()"
                    type="button"
                    class="w-full
                           py-3
                           sm:py-3.5
                           rounded-xl
                           bg-emerald-500
                           hover:bg-emerald-400
                           active:bg-emerald-600
                           text-slate-950
                           text-sm
                           sm:text-base
                           font-bold
                           transition
                           duration-300
                           hover:-translate-y-0.5
                           hover:shadow-lg
                           hover:shadow-emerald-500/20">

                    Login

                </button>


            </form>


            <!-- DIVIDER -->
            <div class="flex items-center gap-3 my-7">

                <div class="h-px flex-1 bg-slate-800"></div>

                <span class="text-[10px]
                             uppercase
                             tracking-widest
                             text-slate-600">

                    BudgetFlow

                </span>

                <div class="h-px flex-1 bg-slate-800"></div>

            </div>


            <!-- REGISTER -->
            <div class="text-center">

                <p class="text-xs sm:text-sm text-slate-400">

                    Don't have an account?

                    <a
                        href="./index.html"
                        class="ml-1
                               text-emerald-400
                               hover:text-emerald-300
                               font-semibold
                               transition">

                        Create Account

                    </a>

                </p>

            </div>


            <!-- FOOTER -->
            <p class="text-center
                      text-[10px]
                      text-slate-600
                      mt-6">

                © 2026 BudgetFlow

            </p>

        </div>

    </main>

</body>

</html>
