<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Transaction History | BudgetFlow</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

</head>


<body class="min-h-screen bg-slate-950 text-white">


    <!-- Navbar -->

    <nav class="border-b border-slate-800 bg-slate-900"
        data-aos="fade-down"
        data-aos-duration="800">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 py-4">


                <!-- Logo -->

                <div class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-xl bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-xl">
                        ₹
                    </div>

                    <h1 class="text-xl sm:text-2xl font-bold">
                        BudgetFlow
                    </h1>

                </div>


                <!-- Navigation -->

                <div class="flex flex-wrap justify-center gap-2">

                    <a href="./dashbord.html"
                        class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-semibold">
                        Dashboard
                    </a>

                    <a href="add.html"
                        class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-semibold">
                        Add Transaction
                    </a>

                    <a href="history.html"
                        class="px-4 py-2 rounded-lg bg-emerald-500 text-slate-950 text-sm font-semibold">
                        History
                    </a>

                    <button onclick="logout()"
                        class="px-4 py-2 rounded-lg border border-red-500/40 text-red-400 hover:bg-red-500/10 text-sm font-semibold transition">
                        Logout
                    </button>

                </div>

            </div>

        </div>

    </nav>



    <!-- Main -->

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">


        <!-- Heading -->

        <div class="mb-8"
            data-aos="fade-up"
            data-aos-duration="800">

            <p class="text-emerald-400 text-sm uppercase tracking-widest font-semibold mb-2">
                Records
            </p>

            <h2 class="text-3xl sm:text-4xl font-bold">
                Transaction History
            </h2>

            <p class="text-slate-400 mt-2">
                View all your income and expense transactions.
            </p>

        </div>



        <!-- Add Transaction -->

        <div class="mb-6"
            data-aos="fade-up"
            data-aos-duration="700"
            data-aos-delay="100">

            <a href="add.html"
                class="inline-block px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold transition">

                + Add Transaction

            </a>

        </div>



        <!-- Transaction Container -->

        <div id="transactionList"
            class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden"
            data-aos="fade-up"
            data-aos-duration="900"
            data-aos-delay="200">


            <!-- Desktop Header -->

            <div class="hidden md:grid grid-cols-12 gap-4 px-6 py-4 border-b border-slate-800 text-slate-400 text-sm font-semibold">

                <div class="col-span-2">
                    Type
                </div>

                <div class="col-span-3">
                    Description
                </div>

                <div class="col-span-2">
                    Amount
                </div>

                <div class="col-span-3">
                    Date & Time
                </div>

                <div class="col-span-2 text-right">
                    Action
                </div>

            </div>



            <!-- Transactions -->

            <div id="transactionList">

                <!-- JavaScript will add transactions here -->

            </div>


        </div>

    </main>

    <script src="./script.js"></script>


    <!-- AOS JS -->

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            once: true
        });
    </script>


</body>

</html>
