<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Add Transaction | BudgetFlow</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

</head>


<body class="min-h-screen bg-slate-950 text-white">


    <!-- ================= NAVBAR ================= -->

    <nav class="border-b border-slate-800 bg-slate-900"
        data-aos="fade-down"
        data-aos-duration="800">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div class="flex flex-col sm:flex-row items-center 
                        justify-between gap-4 py-4">


                <!-- Logo -->

                <div class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-xl 
                                bg-emerald-500 
                                text-slate-950 
                                flex items-center justify-center 
                                font-bold text-xl">
                        ₹
                    </div>

                    <h1 class="text-xl sm:text-2xl font-bold">
                        BudgetFlow
                    </h1>

                </div>


                <!-- Navigation -->

                <div class="flex flex-wrap justify-center gap-2">

                    <a href="./dashbord.html"
                        class="px-4 py-2 rounded-lg 
                               bg-slate-800 
                               hover:bg-slate-700 
                               text-sm font-semibold 
                               transition">
                        Dashboard
                    </a>


                    <a href="add.html"
                        class="px-4 py-2 rounded-lg 
                               bg-emerald-500 
                               text-slate-950 
                               text-sm font-semibold 
                               transition">
                        Add Transaction
                    </a>


                    <a href="history.html"
                        class="px-4 py-2 rounded-lg 
                               bg-slate-800 
                               hover:bg-slate-700 
                               text-sm font-semibold 
                               transition">
                        History
                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- ================= MAIN ================= -->

    <main class="min-h-[calc(100vh-81px)] 
                 flex items-center justify-center 
                 px-4 py-10">


        <div class="w-full max-w-5xl">


            <!-- ================= HEADING ================= -->

            <div class="text-center mb-10"
                data-aos="fade-up"
                data-aos-duration="800">

                <p class="text-emerald-400 
                          text-xs 
                          uppercase 
                          tracking-widest 
                          font-semibold 
                          mb-2">

                    Money Management

                </p>


                <h2 class="text-3xl sm:text-4xl 
                           font-bold 
                           text-white">

                    Add Transaction

                </h2>


                <p class="text-slate-400 
                          text-sm 
                          mt-3">

                    Record your income or expenses easily.

                </p>

            </div>



            <!-- ================= TWO CARDS ================= -->

            <div class="grid grid-cols-1 lg:grid-cols-2 
                        gap-6 lg:gap-8">


                <!-- ================================================= -->
                <!-- TRANSACTION TYPE CARD -->
                <!-- ================================================= -->

                <div class="bg-slate-900 
                            border border-slate-800 
                            rounded-3xl 
                            p-6 sm:p-8 
                            shadow-xl shadow-black/20 
                            hover:border-emerald-500/30 
                            transition duration-300"
                    data-aos="fade-right"
                    data-aos-duration="900"
                    data-aos-delay="100">


                    <!-- Card Heading -->

                    <div class="flex items-start gap-4 mb-8">

                        <div class="w-12 h-12 
                                    rounded-2xl 
                                    bg-emerald-500/10 
                                    text-emerald-400 
                                    flex items-center justify-center 
                                    text-xl 
                                    shrink-0">

                            ₹

                        </div>


                        <div>

                            <h3 class="text-xl font-bold text-white">
                                Transaction
                            </h3>

                            <p class="text-sm text-slate-400 mt-1">
                                Select income or expense.
                            </p>

                        </div>

                    </div>



                    <!-- Transaction Type -->

                    <div class="mb-6">

                        <label
                            class="block text-sm 
                                   font-semibold 
                                   text-slate-300 
                                   mb-2">

                            Transaction Type

                        </label>


                        <select
                            id="transactionType"
                            onchange="showCategory()"
                            class="w-full 
                                   rounded-xl 
                                   bg-slate-800 
                                   border border-slate-700 
                                   text-slate-200 
                                   px-4 py-3.5 
                                   outline-none 
                                   cursor-pointer 
                                   focus:border-emerald-500 
                                   focus:ring-2 
                                   focus:ring-emerald-500/20 
                                   hover:border-slate-600 
                                   transition">

                            <option hidden value="">
                                Select Transaction Type
                            </option>

                            <option value="income">
                                💼 Salary

                            </option>

                            <option value="income">
                                💻 Freelance

                            </option>

                            <option value="income">
                                🏢 Business

                            </option>

                            <option value="income">
                                🎁 Gifts

                            </option>

                            <option value="income">
                                💰 Interest

                            </option>

                            <option value="income">
                                📈 Investment

                            </option>

                            <option value="income">
                                🔄 Refund

                            </option>

                            <option value="income">
                                💵 Other Income

                            </option>


                        </select>

                    </div>



                    <!-- Amount -->

                    <div class="mb-8">

                        <label
                            class="block text-sm 
                                   font-semibold 
                                   text-slate-300 
                                   mb-2">

                            Amount

                        </label>


                        <div class="relative">

                            <span
                                class="absolute 
                                       left-4 
                                       top-1/2 
                                       -translate-y-1/2 
                                       text-emerald-400 
                                       font-semibold">

                                ₹

                            </span>


                            <input
                                type="number"
                                id="amount"
                                placeholder="Enter amount"
                                min="0"
                                class="w-full 
                                       rounded-xl 
                                       bg-slate-800 
                                       border border-slate-700 
                                       text-slate-200 
                                       placeholder-slate-500 
                                       pl-10 pr-4 py-3.5 
                                       outline-none 
                                       focus:border-emerald-500 
                                       focus:ring-2 
                                       focus:ring-emerald-500/20 
                                       hover:border-slate-600 
                                       transition">

                        </div>

                    </div>



                    <!-- Add Transaction Button -->

                    <button
                        onclick="addIncome()"
                        class="w-full 
                               py-3.5 
                               rounded-xl 
                               bg-emerald-500 
                               hover:bg-emerald-400 
                               active:scale-[0.98] 
                               text-slate-950 
                               font-bold 
                               shadow-lg 
                               shadow-emerald-500/10 
                               transition duration-200">

                        + Add Transaction

                    </button>

                </div>



                <!-- ================================================= -->
                <!-- CATEGORY CARD -->
                <!-- ================================================= -->

                <div class="bg-slate-900 
                            border border-slate-800 
                            rounded-3xl 
                            p-6 sm:p-8 
                            shadow-xl shadow-black/20 
                            hover:border-indigo-500/30 
                            transition duration-300"
                    data-aos="fade-left"
                    data-aos-duration="900"
                    data-aos-delay="200">


                    <!-- Card Heading -->

                    <div class="flex items-start gap-4 mb-8">

                        <div class="w-12 h-12 
                                    rounded-2xl 
                                    bg-indigo-500/10 
                                    text-indigo-400 
                                    flex items-center justify-center 
                                    text-xl 
                                    shrink-0">

                            #

                        </div>


                        <div>

                            <h3 class="text-xl font-bold text-white">
                                Expense
                            </h3>

                            <p class="text-sm text-slate-400 mt-1">
                                Choose the transaction category.
                            </p>

                        </div>

                    </div>



                    <!-- Category -->

                    <div class="mb-6">

                        <label
                            class="block text-sm 
                                   font-semibold 
                                   text-slate-300 
                                   mb-2">

                            Transaction Category

                        </label>


                        <select
                            id="category"
                            class="w-full 
                                   rounded-xl 
                                   bg-slate-800 
                                   border border-slate-700 
                                   text-slate-200 
                                   px-4 py-3.5 
                                   outline-none 
                                   cursor-pointer 
                                   focus:border-indigo-500 
                                   focus:ring-2 
                                   focus:ring-indigo-500/20 
                                   hover:border-slate-600 
                                   transition">

                            <option hidden value="">
                                Select Category
                            </option>

                            <option value="income">
                                🍔 Food

                            </option>

                            <option value="expense">
                                🏠 Rent

                            </option>

                            <option value="expense">
                                💡 Bills & Utilities

                            </option>

                            <option value="expense">
                                🛒 Shopping

                            </option>

                            <option value="expense">
                                🚗 Transportation

                            </option>

                            <option value="expense">
                                ⛽ Fuel

                            </option>

                            <option value="expense">
                                🏥 Healthcare

                            </option>

                            <option value="expense">
                                🎬 Entertainment

                            </option>

                            <option value="expense">
                                🎓 Education
                            </option>

                            <option value="expense">
                                📱 Mobile & Internet
                            </option>

                            <option value="expense">
                                ✈️ Travel
                            </option>

                            <option value="expense">
                                💳 Other Expense
                            </option>


                        </select>

                    </div>



                    <!-- Amount -->

                    <div class="mb-8">

                        <label
                            class="block text-sm 
                                   font-semibold 
                                   text-slate-300 
                                   mb-2">

                            Amount

                        </label>


                        <div class="relative">

                            <span
                                class="absolute 
                                       left-4 
                                       top-1/2 
                                       -translate-y-1/2 
                                       text-indigo-400 
                                       font-semibold">

                                ₹

                            </span>


                            <input
                                type="number"
                                id="categoryAmount"
                                placeholder="Enter amount"
                                min="0"
                                class="w-full 
                                       rounded-xl 
                                       bg-slate-800 
                                       border border-slate-700 
                                       text-slate-200 
                                       placeholder-slate-500 
                                       pl-10 pr-4 py-3.5 
                                       outline-none 
                                       focus:border-indigo-500 
                                       focus:ring-2 
                                       focus:ring-indigo-500/20 
                                       hover:border-slate-600 
                                       transition">

                        </div>

                    </div>



                    <!-- Add Transaction Button -->

                    <button
                        onclick="addExpense()"
                        class="w-full 
                               py-3.5 
                               rounded-xl 
                               bg-indigo-500 
                               hover:bg-indigo-400 
                               active:scale-[0.98] 
                               text-white 
                               font-bold 
                               shadow-lg 
                               shadow-indigo-500/10 
                               transition duration-200">

                        + Add Transaction

                    </button>

                </div>

            </div>



            <!-- ================= BACK BUTTON ================= -->

            <a
                href="./dashbord.html"
                class="block 
                       text-center 
                       text-slate-400 
                       hover:text-emerald-400 
                       text-sm 
                       mt-8 
                       transition"
                data-aos="fade-up"
                data-aos-duration="700"
                data-aos-delay="300">

                ← Back to Dashboard

            </a>


        </div>

    </main>



    <!-- JavaScript -->

    <script src="./script.js"></script>


    <!-- AOS JS -->

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script>
        AOS.init({
            once: true
        });
    </script>


</body>

</html>
