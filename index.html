<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | BudgetFlow</title>
    <script src="./script.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white overflow-hidden">

    <div class="min-h-screen flex items-center justify-center p-4">

        <!-- Main Card -->
        <div class="w-full max-w-4xl
                    bg-slate-900
                    rounded-3xl
                    border border-slate-800
                    shadow-2xl
                    overflow-hidden
                    grid grid-cols-1 lg:grid-cols-2">


            <!-- ================= LEFT SIDE ================= -->

            <div class="hidden lg:flex
                        bg-gradient-to-br from-emerald-600
                        via-teal-600 to-slate-900
                        p-8 xl:p-10
                        flex-col justify-between
                        relative overflow-hidden">

                <!-- Decorative Circle -->
                <div class="absolute -top-24 -right-24
                            w-64 h-64
                            bg-white/10
                            rounded-full">
                </div>

                <div class="absolute -bottom-32 -left-20
                            w-72 h-72
                            bg-emerald-300/10
                            rounded-full">
                </div>


                <!-- Logo -->
                <div class="relative z-10 flex items-center gap-3">

                    <div class="w-10 h-10
                                rounded-xl
                                bg-white/20
                                flex items-center justify-center
                                text-xl font-bold">
                        ₹
                    </div>

                    <h1 class="text-xl font-bold">
                        BudgetFlow
                    </h1>

                </div>


                <!-- Content -->
                <div class="relative z-10">

                    <p class="text-emerald-100
                              text-xs uppercase
                              tracking-[0.25em]
                              mb-3">
                        Smart Money Management
                    </p>

                    <h2 class="text-3xl xl:text-4xl
                               font-bold
                               leading-tight
                               mb-4">

                        Your money.
                        <br>

                        <span class="text-emerald-100">
                            Your control.
                        </span>

                    </h2>

                    <p class="text-sm xl:text-base
                              text-white/70
                              leading-relaxed
                              max-w-sm">

                        Track income, control expenses,
                        and understand your financial
                        habits from one simple dashboard.

                    </p>

                </div>


                <!-- Bottom -->
                <p class="relative z-10
                          text-xs
                          text-white/50">

                    © 2026 BudgetFlow

                </p>

            </div>


            <!-- ================= RIGHT SIDE ================= -->

            <div class="flex items-center
                        px-6 py-7
                        sm:px-10 sm:py-8
                        lg:px-10 lg:py-8">

                <div class="w-full max-w-md mx-auto">


                    <!-- Mobile Logo -->
                    <div class="flex lg:hidden
                                items-center justify-center
                                gap-2 mb-5">

                        <div class="w-9 h-9
                                    rounded-lg
                                    bg-emerald-500
                                    text-slate-950
                                    flex items-center justify-center
                                    font-bold">

                            ₹

                        </div>

                        <h1 class="text-xl font-bold">
                            BudgetFlow
                        </h1>

                    </div>


                    <!-- Heading -->
                    <div class="text-center mb-5">

                        <p class="text-emerald-400
                                  text-xs
                                  uppercase
                                  tracking-widest
                                  font-semibold
                                  mb-1">

                            Get Started

                        </p>

                        <h2 class="text-2xl sm:text-3xl
                                   font-bold">

                            Create Account

                        </h2>

                        <p class="text-slate-400
                                  text-sm mt-1">

                            Start managing your money smarter.

                        </p>

                    </div>


                    <!-- Form -->
                    <form class="space-y-4">


                        <!-- Name -->
                        <div>

                            <label
                                for="name"
                                class="block text-sm
                                       font-medium
                                       text-slate-300
                                       mb-1.5">

                                Full Name

                            </label>

                            <input
                                type="text"
                                id="Namee"
                                placeholder="Enter your full name"
                                class="w-full
                                       px-4 py-3
                                       rounded-xl
                                       bg-slate-800
                                       border border-slate-700
                                       text-white
                                       text-sm
                                       placeholder-slate-500
                                       outline-none
                                       transition
                                       focus:border-emerald-500
                                       focus:ring-2
                                       focus:ring-emerald-500/20">
                        </div>


                        <!-- Email -->
                        <div>

                            <label
                                for="email"
                                class="block text-sm
                                       font-medium
                                       text-slate-300
                                       mb-1.5">

                                Email Address

                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="you@example.com"
                                class="w-full
                                       px-4 py-3
                                       rounded-xl
                                       bg-slate-800
                                       border border-slate-700
                                       text-white
                                       text-sm
                                       placeholder-slate-500
                                       outline-none
                                       transition
                                       focus:border-emerald-500
                                       focus:ring-2
                                       focus:ring-emerald-500/20">
                        </div>


                        <!-- Password -->
                        <div>

                            <label
                                for="password"
                                class="block text-sm
                                       font-medium
                                       text-slate-300
                                       mb-1.5">

                                Password

                            </label>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                class="w-full
                                       px-4 py-3
                                       rounded-xl
                                       bg-slate-800
                                       border border-slate-700
                                       text-white
                                       text-sm
                                       placeholder-slate-500
                                       outline-none
                                       transition
                                       focus:border-emerald-500
                                       focus:ring-2
                                       focus:ring-emerald-500/20">
                        </div>


                        <!-- Button -->
                        <button
                        onclick="loging()"
                            id="log"
                            type="button"
                            class="w-full
                                   py-3
                                   rounded-xl
                                   bg-emerald-500
                                   hover:bg-emerald-400
                                   text-slate-950
                                   text-sm
                                   font-bold
                                   transition
                                   duration-300
                                   hover:-translate-y-0.5
                                   shadow-lg
                                   shadow-emerald-500/10">Create Account</button>

                    </form>


                    <!-- Login -->
                    <p class="text-center
                              text-sm
                              text-slate-400
                              mt-5">

                        Already have an account?

                        <a
                            href="index.html"
                            class="text-emerald-400
                                   hover:text-emerald-300
                                   font-semibold
                                   transition">

                            Login

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
