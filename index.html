<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | BudgetFlow</title>

    <script src="./script.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- Background -->
    <div class="relative min-h-screen overflow-hidden bg-slate-950">

        <!-- Background Gradient -->
        <div class="absolute inset-0
                    bg-gradient-to-br
                    from-emerald-950
                    via-slate-950
                    to-teal-950">
        </div>


        <!-- Large Emerald Glow - Top Left -->
        <div class="absolute
                    -top-40
                    -left-40
                    w-[550px]
                    h-[550px]
                    bg-emerald-500/20
                    rounded-full
                    blur-[100px]">
        </div>


        <!-- Large Teal Glow - Bottom Right -->
        <div class="absolute
                    -bottom-40
                    -right-40
                    w-[550px]
                    h-[550px]
                    bg-teal-500/20
                    rounded-full
                    blur-[100px]">
        </div>


        <!-- Emerald Glow - Right Top -->
        <div class="absolute
                    top-20
                    right-10
                    w-72
                    h-72
                    bg-emerald-400/10
                    rounded-full
                    blur-[80px]">
        </div>


        <!-- Teal Glow - Bottom Left -->
        <div class="absolute
                    bottom-10
                    left-10
                    w-72
                    h-72
                    bg-teal-400/10
                    rounded-full
                    blur-[80px]">
        </div>


        <!-- Decorative Circle -->
        <div class="absolute
                    top-16
                    left-1/2
                    -translate-x-1/2
                    w-[450px]
                    h-[450px]
                    border
                    border-emerald-500/10
                    rounded-full">
        </div>


        <!-- Decorative Circle -->
        <div class="absolute
                    top-24
                    left-1/2
                    -translate-x-1/2
                    w-[350px]
                    h-[350px]
                    border
                    border-teal-400/10
                    rounded-full">
        </div>


        <!-- Grid Pattern -->
        <div class="absolute inset-0
                    opacity-[0.08]
                    bg-[linear-gradient(rgba(16,185,129,0.5)_1px,transparent_1px),
                        linear-gradient(90deg,rgba(16,185,129,0.5)_1px,transparent_1px)]
                    bg-[size:45px_45px]">
        </div>


        <!-- Main Content -->
        <div class="relative z-10
                    min-h-screen
                    flex flex-col
                    items-center
                    justify-center
                    px-4
                    py-4
                    sm:py-5">


            <!-- Brand -->
            


            <!-- Registration Card -->
            <div class="w-full
                        max-w-md
                        bg-slate-900
                        border
                        border-slate-800
                        rounded-2xl
                        shadow-2xl
                        p-5
                        sm:p-7">

                         <div class="flex items-center gap-3 mb-4 sm:mb-5">

                <div class="w-10 h-10 sm:w-11 sm:h-11
                            rounded-xl
                            bg-emerald-500
                            text-slate-950
                            flex items-center justify-center
                            text-xl
                            font-bold
                            shadow-lg
                            shadow-emerald-500/20">

                    ₹

                </div>

                <h1 class="text-xl sm:text-2xl font-bold">

                    BudgetFlow

                </h1>

            </div>

                <!-- Heading INSIDE CARD -->
                <div class="text-center
                            mb-6
                            pb-5
                            border-b
                            border-slate-800">

                    <!-- <div class="inline-flex
                                items-center
                                px-3 py-1
                                rounded-full
                                bg-emerald-500/10
                                border
                                border-emerald-500/20
                                text-emerald-400
                                text-xs
                                font-semibold
                                uppercase
                                tracking-widest
                                mb-3">

                        Get Started

                    </div> -->


                    <h2 class="text-2xl sm:text-3xl
                               font-bold">

                        Create Account

                    </h2>


                    <p class="text-slate-400
                              text-xs
                              sm:text-sm
                              mt-1.5">

                        Start managing your money smarter.

                    </p>

                </div>


                <!-- Form -->
                <form class="space-y-4">


                    <!-- Full Name -->
                    <div>

                        <label
                            for="name"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-300
                                   mb-1.5">

                            Full Name

                        </label>


                        <input
                            type="text"
                            id="Namee"
                            placeholder="Enter your full name"
                            class="w-full
                                   px-4
                                   py-3
                                   rounded-xl
                                   bg-slate-800
                                   border
                                   border-slate-700
                                   text-white
                                   text-sm
                                   placeholder-slate-500
                                   outline-none
                                   transition
                                   duration-200
                                   hover:border-slate-600
                                   focus:border-emerald-500
                                   focus:ring-2
                                   focus:ring-emerald-500/20">

                    </div>


                    <!-- Email -->
                    <div>

                        <label
                            for="email"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-300
                                   mb-1.5">

                            Email Address

                        </label>


                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            class="w-full
                                   px-4
                                   py-3
                                   rounded-xl
                                   bg-slate-800
                                   border
                                   border-slate-700
                                   text-white
                                   text-sm
                                   placeholder-slate-500
                                   outline-none
                                   transition
                                   duration-200
                                   hover:border-slate-600
                                   focus:border-emerald-500
                                   focus:ring-2
                                   focus:ring-emerald-500/20">

                    </div>


                    <!-- Password -->
                    <div>

                        <label
                            for="password"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-300
                                   mb-1.5">

                            Password

                        </label>


                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            class="w-full
                                   px-4
                                   py-3
                                   rounded-xl
                                   bg-slate-800
                                   border
                                   border-slate-700
                                   text-white
                                   text-sm
                                   placeholder-slate-500
                                   outline-none
                                   transition
                                   duration-200
                                   hover:border-slate-600
                                   focus:border-emerald-500
                                   focus:ring-2
                                   focus:ring-emerald-500/20">

                    </div>


                    <!-- Button -->
                    <button
                        onclick="loging()"
                        id="log"
                        type="button"
                        class="w-full
                               py-3
                               rounded-xl
                               bg-emerald-500
                               hover:bg-emerald-400
                               active:bg-emerald-600
                               text-slate-950
                               text-sm
                               font-bold
                               transition
                               duration-300
                               hover:-translate-y-0.5
                               hover:shadow-lg
                               hover:shadow-emerald-500/20
                               focus:outline-none
                               focus:ring-2
                               focus:ring-emerald-500/40">

                        Create Account

                    </button>


                </form>


                <!-- Login -->
                <div class="mt-5
                            pt-4
                            border-t
                            border-slate-800
                            text-center">

                    <p class="text-sm text-slate-400">

                        Already have an account?

                        <a
                            href="./login.html"
                            class="ml-1
                                   text-emerald-400
                                   hover:text-emerald-300
                                   font-semibold
                                   transition">

                            Login

                        </a>

                    </p>


                    <p class="text-xs
                              text-slate-600
                              mt-4">

                        © 2026 BudgetFlow

                    </p>

                </div>


            </div>


        </div>

    </div>

</body>

</html>
