<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | BudgetFlow</title>

    <script src="./script.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- Background -->
    <div class="relative min-h-screen overflow-hidden">

        <!-- Decorative Background -->
        <div class="absolute top-0 left-1/2
                    -translate-x-1/2
                    w-[500px] h-[300px]
                    sm:w-[700px] sm:h-[400px]
                    bg-emerald-500/10
                    blur-3xl
                    rounded-full">
        </div>

        <div class="absolute bottom-0 right-0
                    w-72 h-72
                    bg-teal-500/5
                    blur-3xl
                    rounded-full">
        </div>


        <!-- Main Content -->
        <div class="relative z-10
                    min-h-screen
                    flex flex-col
                    items-center
                    justify-center
                    px-4
                    py-8">


            <!-- Brand -->
            <div class="flex items-center gap-3 mb-7">

                <div class="w-11 h-11
                            rounded-xl
                            bg-emerald-500
                            text-slate-950
                            flex items-center justify-center
                            text-xl
                            font-bold
                            shadow-lg
                            shadow-emerald-500/20">

                    ₹

                </div>

                <h1 class="text-2xl font-bold">
                    BudgetFlow
                </h1>

            </div>



            <!-- Registration Card -->
            <div class="w-full
                        max-w-md
                        bg-slate-900
                        border
                        border-slate-800
                        rounded-2xl
                        shadow-2xl
                        p-6
                        sm:p-8">


                <!-- Heading -->
                <div class="text-center mb-7">

                    <div class="inline-flex
                                items-center
                                px-3 py-1
                                rounded-full
                                bg-emerald-500/10
                                border
                                border-emerald-500/20
                                text-emerald-400
                                text-xs
                                font-semibold
                                uppercase
                                tracking-widest
                                mb-4">

                        Get Started

                    </div>


                    <h2 class="text-2xl sm:text-3xl
                               font-bold">

                        Create Account

                    </h2>


                    <p class="text-slate-400
                              text-sm
                              mt-2">

                        Start managing your money smarter.

                    </p>

                </div>



                <!-- Form -->
                <form class="space-y-5">


                    <!-- Full Name -->
                    <div>

                        <label
                            for="name"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-300
                                   mb-2">

                            Full Name

                        </label>


                        <input
                            type="text"
                            id="Namee"
                            placeholder="Enter your full name"
                            class="w-full
                                   px-4
                                   py-3.5
                                   rounded-xl
                                   bg-slate-800
                                   border
                                   border-slate-700
                                   text-white
                                   text-sm
                                   placeholder-slate-500
                                   outline-none
                                   transition
                                   duration-200
                                   hover:border-slate-600
                                   focus:border-emerald-500
                                   focus:ring-2
                                   focus:ring-emerald-500/20">

                    </div>



                    <!-- Email -->
                    <div>

                        <label
                            for="email"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-300
                                   mb-2">

                            Email Address

                        </label>


                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            class="w-full
                                   px-4
                                   py-3.5
                                   rounded-xl
                                   bg-slate-800
                                   border
                                   border-slate-700
                                   text-white
                                   text-sm
                                   placeholder-slate-500
                                   outline-none
                                   transition
                                   duration-200
                                   hover:border-slate-600
                                   focus:border-emerald-500
                                   focus:ring-2
                                   focus:ring-emerald-500/20">

                    </div>



                    <!-- Password -->
                    <div>

                        <label
                            for="password"
                            class="block
                                   text-sm
                                   font-medium
                                   text-slate-300
                                   mb-2">

                            Password

                        </label>


                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            class="w-full
                                   px-4
                                   py-3.5
                                   rounded-xl
                                   bg-slate-800
                                   border
                                   border-slate-700
                                   text-white
                                   text-sm
                                   placeholder-slate-500
                                   outline-none
                                   transition
                                   duration-200
                                   hover:border-slate-600
                                   focus:border-emerald-500
                                   focus:ring-2
                                   focus:ring-emerald-500/20">

                    </div>



                    <!-- Button -->
                    <button
                        onclick="loging()"
                        id="log"
                        type="button"
                        class="w-full
                               py-3.5
                               rounded-xl
                               bg-emerald-500
                               hover:bg-emerald-400
                               active:bg-emerald-600
                               text-slate-950
                               text-sm
                               font-bold
                               transition
                               duration-300
                               hover:-translate-y-0.5
                               hover:shadow-lg
                               hover:shadow-emerald-500/20
                               focus:outline-none
                               focus:ring-2
                               focus:ring-emerald-500/40">

                        Create Account

                    </button>


                </form>



                <!-- Login -->
                <div class="mt-6
                            pt-5
                            border-t
                            border-slate-800
                            text-center">

                    <p class="text-sm text-slate-400">

                        Already have an account?

                        <a
                            href="./login.html"
                            class="ml-1
                                   text-emerald-400
                                   hover:text-emerald-300
                                   font-semibold
                                   transition">

                            Login

                        </a>

                    </p>

                </div>


            </div>



            <!-- Bottom Text -->
            <p class="text-xs
                      text-slate-600
                      mt-6">

                © 2026 BudgetFlow

            </p>


        </div>

    </div>

</body>

</html>
